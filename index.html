<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四年级英语小帮手 🌟</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    background: linear-gradient(180deg, #FFF3C4 0%, #CDEBFF 55%, #D8F7D4 100%);
    min-height: 100vh;
    color: #333;
    font-size: 18px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px 14px 40px; }
  header {
    background: #fff; border-radius: 20px; padding: 18px 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); text-align: center;
  }
  header h1 { margin: 0 0 4px; font-size: 30px; color: #FF7A1A; }
  header p { margin: 4px 0 0; color: #666; font-size: 16px; }
  .stats { display: flex; justify-content: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .stat {
    background: #FFF7E0; border: 2px solid #FFD166; border-radius: 999px;
    padding: 8px 18px; font-size: 20px; font-weight: bold;
  }
  .stat.fire { background: #FFE8E0; border-color: #FF9E7D; }
  h2 { font-size: 22px; margin: 22px 0 10px; color: #2B5EA7; }
  .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .unit-btn {
    background: #fff; border: 3px solid #BFE3FF; border-radius: 16px;
    padding: 12px 8px; font-size: 17px; font-weight: bold; color: #2B5EA7;
    cursor: pointer; line-height: 1.4;
  }
  .unit-btn .unit-en { font-size: 14px; color: #888; font-weight: normal; }
  .unit-btn .count { background: #E8F4FF; border-radius: 999px; padding: 1px 8px; font-size: 13px; color: #2B5EA7; }
  .unit-btn.active { background: #FFE08A; border-color: #FF9F1C; color: #7A4A00; }
  .mode-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .mode-btn {
    flex: 1 1 30%; min-width: 100px; border: none; border-radius: 16px;
    padding: 14px 6px; font-size: 18px; font-weight: bold; color: #fff;
    cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  .mode-btn[data-mode="cards"] { background: #FF9F1C; }
  .mode-btn[data-mode="listen"] { background: #2E86DE; }
  .mode-btn[data-mode="spell"] { background: #27AE60; }
  .mode-btn[data-mode="wordquiz"] { background: #8E44AD; }
  .mode-btn[data-mode="wrong"] { background: #E74C3C; }
  .mode-btn[data-mode="parent"] { background: #7F8C8D; }
  .wrong-badge {
    background: #fff; color: #E74C3C; border-radius: 999px;
    padding: 1px 8px; font-size: 14px; margin-left: 2px;
  }
  .mode-btn.active { outline: 4px solid #333; outline-offset: -2px; }
  .panel {
    background: #fff; border-radius: 20px; padding: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); margin-top: 12px;
  }
  .big { font-size: 22px; font-weight: bold; text-align: center; }
  .tip { color: #888; font-size: 15px; text-align: center; }
  .big-btn {
    border: none; border-radius: 14px; padding: 14px 26px;
    font-size: 20px; font-weight: bold; color: #fff; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  .big-btn.green { background: #27AE60; }
  .big-btn.blue { background: #2E86DE; }
  .big-btn.orange { background: #FF7A1A; }
  .big-btn.gray { background: #95A5A6; }
  .big-btn:disabled { opacity: .5; cursor: default; }
  .small-btn {
    border: 2px solid #BFE3FF; background: #fff; border-radius: 10px;
    padding: 6px 10px; font-size: 15px; cursor: pointer; color: #2B5EA7;
  }
  .small-btn.danger { border-color: #FFB3B3; color: #E74C3C; }
  /* 单词卡片 */
  .card3d { perspective: 1200px; cursor: pointer; }
  .card-inner {
    position: relative; min-height: 300px;
    transform-style: preserve-3d; transition: transform .5s;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 20px;
    text-align: center;
  }
  .card-front { background: linear-gradient(160deg, #FFE08A, #FFB347); }
  .card-back { background: linear-gradient(160deg, #A8E6CF, #7FD1B9); transform: rotateY(180deg); }
  .card-emoji { font-size: 64px; line-height: 1; }
  .card-word { font-size: 52px; font-weight: bold; color: #333; word-break: break-word; }
  .card-zh { font-size: 44px; font-weight: bold; color: #14532D; }
  .card-ex { font-size: 20px; color: #1E6B45; font-style: italic; }
  .speak-btn {
    border: none; background: #fff; border-radius: 999px;
    padding: 10px 22px; font-size: 20px; font-weight: bold; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .flip-hint { font-size: 15px; color: rgba(0,0,0,.55); }
  .card-nav { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .card-counter { text-align: center; color: #666; margin-top: 12px; font-size: 16px; }
  .tag { background: #FF9F1C; color: #fff; font-size: 13px; border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
  /* 测验 */
  .quiz-intro { text-align: center; }
  .quiz-progress { text-align: center; color: #888; margin-bottom: 10px; }
  .quiz-prompt { text-align: center; margin-bottom: 16px; }
  .quiz-zh { font-size: 40px; font-weight: bold; color: #8E44AD; margin-top: 8px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt-btn {
    background: #F2F7FF; border: 3px solid #BFE3FF; border-radius: 16px;
    padding: 18px 10px; font-size: 22px; font-weight: bold; color: #2B5EA7;
    cursor: pointer; min-height: 76px;
  }
  .opt-btn .opt-emoji { font-size: 34px; }
  .opt-btn.correct { background: #C8F7C5; border-color: #27AE60; color: #1E7A34; }
  .opt-btn.wrong { background: #FFD6D6; border-color: #E74C3C; color: #A93226; }
  .opt-btn:disabled { cursor: default; }
  .feedback { margin-top: 16px; text-align: center; font-size: 20px; }
  .fb-good { background: #E8FBE8; border-radius: 14px; padding: 14px; color: #1E7A34; }
  .fb-bad { background: #FFF0F0; border-radius: 14px; padding: 14px; color: #A93226; }
  .fb-word { font-size: 26px; font-weight: bold; }
  .quiz-next { text-align: center; margin-top: 14px; }
  .spell-hint { margin-top: 10px; font-size: 18px; color: #666; }
  .spell-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .spell-row input {
    font-size: 24px; padding: 12px 14px; border-radius: 14px;
    border: 3px solid #BFE3FF; width: min(320px, 90%); text-align: center;
  }
  .quiz-result { text-align: center; }
  .score { font-size: 56px; font-weight: bold; color: #FF7A1A; margin: 8px 0; }
  /* 家长模式 */
  .parent-note { background: #FFF7E0; border-radius: 12px; padding: 12px; font-size: 16px; margin-bottom: 14px; }
  .parent-form { background: #F7F9FC; border-radius: 14px; padding: 14px; margin-bottom: 18px; }
  .parent-form h3 { margin: 0 0 10px; }
  .parent-form label { display: block; margin-bottom: 10px; font-size: 16px; font-weight: bold; }
  .parent-form input, .parent-form select, .parent-form textarea {
    display: block; width: 100%; margin-top: 4px; font-size: 18px;
    padding: 10px; border-radius: 10px; border: 2px solid #CCC;
  }
  .parent-form textarea { font-size: 15px; word-break: break-all; resize: vertical; }
  .form-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .form-msg { margin-top: 8px; color: #27AE60; font-weight: bold; }
  .parent-list-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .parent-list-head h3 { margin: 0; }
  .parent-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid #EEE; flex-wrap: wrap;
  }
  .pr-emoji { font-size: 26px; }
  .pr-word { flex: 1; min-width: 140px; font-size: 17px; }
  .pr-btns { display: flex; gap: 6px; }
  footer { text-align: center; color: #777; font-size: 14px; margin-top: 24px; line-height: 1.7; }
  @media (max-width: 480px) {
    .card-word { font-size: 40px; }
    .card-zh { font-size: 34px; }
    .quiz-zh { font-size: 32px; }
    .opt-btn { font-size: 19px; }
    header h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌟 四年级英语小帮手 🌟</h1>
    <p>人教版 PEP · 四年级上册 + 下册 · 加常用词扩展包 · 每天练一练，英语棒棒哒！</p>
    <div class="stats">
      <span class="stat">⭐ <span id="starCount">0</span> 颗星</span>
      <span class="stat fire">🔥 连续学习 <span id="streakCount">1</span> 天</span>
    </div>
  </header>

  <h2>📚 选一个单元</h2>
  <div class="unit-grid" id="unitPicker"></div>

  <h2>🎮 选一种玩法</h2>
  <div class="mode-row">
    <button class="mode-btn active" data-mode="cards">🃏 单词卡片</button>
    <button class="mode-btn" data-mode="listen">🎧 听音选词</button>
    <button class="mode-btn" data-mode="spell">✏️ 听音拼写</button>
    <button class="mode-btn" data-mode="wordquiz">❓ 看中文选英文</button>
    <button class="mode-btn" data-mode="wrong">📕 生词本 <span class="wrong-badge" id="wrongCountBadge" style="display:none">0</span></button>
    <button class="mode-btn" data-mode="parent">👨‍👩‍👧 家长模式</button>
  </div>

  <!-- 单词卡片 -->
  <div class="panel mode-panel" id="panel-cards">
    <div id="cardBox"></div>
    <div class="card-nav">
      <button class="big-btn blue" id="prevCard">⬅️ 上一个</button>
      <button class="big-btn orange" id="shuffleCards">🔀 打乱顺序</button>
      <button class="big-btn blue" id="nextCard">下一个 ➡️</button>
    </div>
    <div class="card-counter" id="cardCounter"></div>
  </div>

  <!-- 测验（三种共用同一逻辑，各用自己的容器） -->
  <div class="panel mode-panel" id="panel-listen" style="display:none">
    <div id="quizBox-listen"></div>
  </div>
  <div class="panel mode-panel" id="panel-spell" style="display:none">
    <div id="quizBox-spell"></div>
  </div>
  <div class="panel mode-panel" id="panel-wordquiz" style="display:none">
    <div id="quizBox-wordquiz"></div>
  </div>

  <!-- 生词本 -->
  <div class="panel mode-panel" id="panel-wrong" style="display:none">
    <div id="wrongBox"></div>
  </div>

  <!-- 家长模式 -->
  <div class="panel mode-panel" id="panel-parent" style="display:none">
    <div id="parentBox"></div>
  </div>

  <footer>
    单词来自人教版 PEP 四年级上册、下册课本 + 常用词扩展包（数字/颜色/动物/食物/身体部位/时间） · 发音使用浏览器自带语音<br>
    没有登录，没有广告，不收集任何信息 · 学习记录保存在这台设备上，设置云同步后换设备也能接着学
  </footer>
</div>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
